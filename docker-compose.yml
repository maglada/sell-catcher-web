services:
  # ASP.NET Core API
  api:
    build:
      context: .
      dockerfile: SellCatcher.Docker/Dockerfile.api
    container_name: sellcatcher-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      # Allow requests from ngrok domains
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    volumes:
      - ./data:/app/data
    networks:
      - sellcatcher-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Blazor Frontend
  frontend:
    build:
      context: .
      dockerfile: SellCatcher.Blazor/Dockerfile
    container_name: sellcatcher-frontend
    ports:
      - "3000:3000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Use your ngrok API URL here
      - API_URL=${NGROK_API_URL:-http://localhost:5000}
    networks:
      - sellcatcher-net
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # Background Scraper Service (runs every 24 hours)
  scraper:
    build:
      context: .
      dockerfile: SellCatcher.Docker/Dockerfile.scraper
    container_name: sellcatcher-scraper
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - ./data:/app/data
    networks:
      - sellcatcher-net
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

networks:
  sellcatcher-net:
    driver: bridge

volumes:
  data:
    driver: local